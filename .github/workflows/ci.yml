name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck *.sh
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          failure-threshold: warning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: athens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: start
        run: |
          docker run -d --name athens -p 3000:3000 \
            -e ATHENS_STORAGE_TYPE=memory \
            athens:ci
      - name: smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000/healthz
          curl -fsS http://localhost:3000/ | tee home.out | grep -q '</html>'
          grep -q 'github.com/google/uuid' home.out
      - name: logs
        if: always()
        run: docker logs athens
